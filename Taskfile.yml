version: '3'

tasks:
  build:
    cmds:
      - go build -o tran .

  install:
    cmds:
      - go install .

  run:
    cmds:
      - go run . {{.CLI_ARGS}}

  lint:
    cmds:
      - go vet ./...

  uninstall:
    cmds:
      - rm -f $(go env GOPATH)/bin/tran

  clean:
    cmds:
      - rm -f tran
